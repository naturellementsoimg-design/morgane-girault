  <title>Morgane Girault — Accès Officiel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter&family=Playfair+Display&display=swap');
    :root {
      --black: #3b1d57;
      --off-white: #f8f6f1;
      --grey: #7d6f8f;
      --accent: #c6a86b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--off-white);
      font-family: 'Inter', sans-serif;
      color: var(--black);
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px 28px;
      text-align: center;
    }
    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(59,29,87,0.2);
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      margin: 0 0 12px;
    }
    p {
      font-size: 0.95rem;
      color: var(--grey);
      margin: 0 0 32px;
      line-height: 1.5;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .link-primary,
    .link-secondary {
      display: block;
      padding: 16px 20px;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }
    .link-primary {
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .link-primary:hover {
      background-color: var(--accent);
      color: var(--black);
    }
    .link-secondary {
      border: 1px solid var(--black);
      color: var(--black);
    }
    .link-secondary:hover {
      background-color: var(--black);
      color: var(--off-white);
    }
    footer {
      margin-top: 40px;
      font-size: 0.75rem;
      color: var(--grey);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">
      <!-- Remplacer src par ta photo -->
      <img src="https://res.cloudinary.com/diapyc6q1/image/upload/v1770631460/PHOTO-2026-02-09-17-04-07_cb1kpo.jpg" alt="Morgane Girault" />
    </div>
    <h1>Morgane Girault</h1>
    <p>
      Trois portes d’entrée.
      <br />
      Choisissez votre niveau de clarté et d’engagement.
    </p>
    <div class="links">
      <a class="link-primary" href="https://naturellement-soi.com/.html" target="_blank" rel="noopener noreferrer">
        SoulMap Classique · Clarifier votre axe
      </a>

      <a class="link-primary" href="https://naturellement-soi.com/soulmap-pro.html" target="_blank" rel="noopener noreferrer">
        SoulMap Pro · Recalibrage professionnel
      </a>

      <a class="link-secondary" href="https://naturellement-soi.com/soin-vocal-clarte-express.html" target="_blank" rel="noopener noreferrer">
        Clarté Express · Intervention ciblée
      </a>

      <a class="link-secondary" href="https://morgane-girault.com/mentorat.html" target="_blank" rel="noopener noreferrer">
        Mentorat 1:1 · Décisions & repositionnement
      </a>
    </div>
    <footer>
      © Morgane Girault · Cartographe d’âmes
    </footer>
  </main>
</body>
